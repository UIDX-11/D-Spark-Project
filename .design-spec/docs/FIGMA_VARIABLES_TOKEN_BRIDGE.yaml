# Figma Variables → D-Spark CSS tokens bridge
#
# Authoritative mapping from Figma library variable paths in the
# "D.S. Web Com — Light V2 2026" file (fileKey: KJfy0GFDs8kLsXTzhTxAjd) to
# semantic-layer CSS variables produced by .design-spec/tokens/dist/tokens.css.
#
# Rules:
# - Bridge entries map Figma variables to **semantic** CSS variables, not to
#   raw core hex/px. Consumers (AI tools, generators, demos) should always
#   consume `--semantic-*` or `--component-*` vars from `tokens/dist/tokens.css`.
# - When Figma exposes both a "组件绑定 bound" and "无组件绑定 unbound" alias
#   that resolve to the same hex/px, bridge them to the same semantic var.
# - When a Figma variable has no semantic equivalent yet, leave `tokenCss: null`
#   and add an entry under `gaps:` so it is tracked.
# - The Figma variable name is the **path string** returned by the Figma MCP
#   `get_variable_defs` tool (mixed bilingual labels are intentional).
# - `notes` may mention which pilot components use the variable so reviewers
#   can spot scope.

version: "0.1.0"
schemaVersion: "0.1.0"
kind: "tokenMap"

figmaFile:
  fileKey: "KJfy0GFDs8kLsXTzhTxAjd"
  name: "D.S. Web Com — Light V2 2026"
  mode: "Light"
