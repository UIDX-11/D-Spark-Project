name: Design spec — docs & e2e

on:
  pull_request:
    paths:
      - ".design-spec/**"
      - ".github/workflows/design-spec-e2e.yml"
  push:
    branches: [main, design-spec-kb-v0.1]
    paths:
      - ".design-spec/**"
      - ".github/workflows/design-spec-e2e.yml"

jobs:
  doc-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce Vue truth source
        run: python3 .design-spec/checks/ensure_react_truth_source.py
      - name: Component doc accuracy (strict)
        run: python3 .design-spec/checks/doc_accuracy_guard.py --strict
      - name: Validate Figma agent markdown structure
        run: python3 .design-spec/checks/validate_figma_agent_docs.py

  playwright:
    needs: doc-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .design-spec/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .design-spec/e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .design-spec/e2e/playwright-report/
